server:
  port: 8091

spring:
  application:
    name: gateway-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: member-service
              uri: ${service-uri.member}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/member/**

service-uri:
  member: http://member-service

management:
  endpoint:
    health:
      probes:
        enabled: true

jwt:
  public-key: ${JWT_PUBLIC_KEY}