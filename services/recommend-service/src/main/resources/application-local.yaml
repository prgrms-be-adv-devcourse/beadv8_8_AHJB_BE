spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/recommend_db
    username: ${RECOMMEND_DB_USERNAME:recommend_svc}
    password: ${RECOMMEND_DB_PASSWORD:recommend-db-secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092