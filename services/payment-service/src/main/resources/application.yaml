spring:
  application:
    name: payment
  jpa:
    open-in-view: false
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false   # 클래스 이름을 헤더에 싣지 않음
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

server:
  port: 8085

# 토스페이먼츠 (실제 키는 .env 로 주입, 파일에 적지 않음)
toss:
  payments:
    base-url: ${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
    client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}   # 프론트 결제창 호출용 (공개 키)
    secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}   # 서버 승인·취소 호출용 (비공개 키)

# 지갑 정책
wallet:
  fee-rate-percent: 10   # 판매 수수료율 (%)
