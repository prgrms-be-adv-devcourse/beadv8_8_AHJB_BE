spring:
  # 주문·정산 테스트는 H2 를 쓴다. 결제 통합 테스트는 PostgreSQL 컨테이너(@ServiceConnection)가 이 값을 대신한다
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:1
    admin:
      auto-create: false
    listener:
      auto-startup: false
    producer:
      properties:
        "[max.block.ms]": 0

toss:
  payments:
    secret-key: test_sk_dummy

payment-service:
  base-url: http://localhost:1
