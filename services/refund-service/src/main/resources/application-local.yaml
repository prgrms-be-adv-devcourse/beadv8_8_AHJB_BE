spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/refund_db
    username: ${REFUND_DB_USERNAME:refund_svc}
    password: ${REFUND_DB_PASSWORD:refund-db-secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092

logging:
  level:
    org.hibernate.SQL: debug
