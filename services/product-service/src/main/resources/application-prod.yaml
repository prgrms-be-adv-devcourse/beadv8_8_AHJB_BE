spring:
  datasource:
    url: ${PRODUCT_DB_URL}
    username: ${PRODUCT_DB_USERNAME}
    password: ${PRODUCT_DB_PASSWORD}
  kafka:
    bootstrap-servers: kafka.infra.svc.cluster.local:19092

# 상품 이미지는 S3에 저장한다. (서버 IAM 역할로 인증, Access Key 불필요)
# 현재 서버 IAM 권한이 버킷의 dev/ 경로만 허용하므로 key-prefix는 dev/를 유지한다.
product-image:
  storage: ${PRODUCT_IMAGE_STORAGE:s3}
  bucket: ${S3_BUCKET:team03-jjinmak-s3-823315816237-ap-northeast-2-an}
  region: ${AWS_REGION:ap-northeast-2}
  key-prefix: ${S3_KEY_PREFIX:dev/}
  public-base-url: ${S3_PUBLIC_BASE_URL:https://team03-jjinmak-s3-823315816237-ap-northeast-2-an.s3.ap-northeast-2.amazonaws.com}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  forward-headers-strategy: native
