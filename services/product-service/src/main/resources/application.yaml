# 서버용 설정. 값은 k8s ConfigMap/Secret 환경변수로 받는다. (기본값을 두지 않는다)
# 로컬 실행은 application-local.yaml (Active profiles: local)
server:
  port: 8086

spring:
  application:
    name: product-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 10MB      # 파일 하나당 최대 크기
      max-request-size: 12MB   # 요청 전체 최대 크기 (파일을 제외하고 2MB를 넉넉하게 할당함)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false   # 클래스 이름을 헤더에 싣지 않음
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

management:
  endpoint:
    health:
      probes:
        enabled: true

# 상품 이미지 저장소. 서버는 S3를 쓴다.
product-image:
  storage: ${IMAGE_STORAGE}             # s3
  bucket: ${S3_BUCKET}
  region: ${AWS_REGION}
  key-prefix: ${S3_KEY_PREFIX}          # 환경별 경로 접두사 (예: dev/)
  public-base-url: ${S3_PUBLIC_BASE_URL}
