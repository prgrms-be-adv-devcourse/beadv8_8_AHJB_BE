# 테스트 전용 설정. 서버용 application.yaml은 환경변수 기본값이 없어서 테스트에서 채운다.
# (classpath:/config/ 는 main의 application.yaml보다 우선한다)
spring:
  datasource:
    url: jdbc:h2:mem:market;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      auto-create: false
    listener:
      auto-startup: false
    producer:
      properties:
        "[max.block.ms]": 0   # 브로커 없이 send가 막히지 않게 바로 실패

# 아웃박스 전송 스케줄러는 끈다 (KafkaTemplate이 mock, #548)
market:
  outbox:
    relay:
      enabled: false
  # 경매 종료 타이머(100ms tick)는 끈다. 타이밍 휠은 TimingWheelTest·AuctionCloseTimerTest에서 단위로 검증 (#548 4차)
  auction:
    close:
      timer:
        enabled: false

product-image:
  storage: local
  bucket: ""
  region: ap-northeast-2
  key-prefix: test/
  public-base-url: http://localhost:8086/local-images
