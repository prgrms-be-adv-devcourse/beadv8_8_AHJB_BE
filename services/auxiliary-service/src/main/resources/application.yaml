server:
  port: 8087
  shutdown: graceful

spring:
  application:
    name: auxiliary-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    out-of-order: true   # 컨텍스트별로 날짜 버전(V20261120_1430__…)을 섞어 추가해도 적용되게
  task:
    scheduling:
      pool:
        size: 3          # 기본 1이면 스케줄러가 한 스레드에서 줄 서서 돈다
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false   # 클래스 이름을 헤더에 싣지 않음
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

# notification
notification:
  push:
    web-base-url: ${WEB_BASE_URL:http://localhost:3000}
    fcm:
      enabled: ${FCM_ENABLED:false}
      credentials-base64: ${FCM_CREDENTIALS_BASE64:}

# delivery
delivery-tracker:
  base-url: https://apis.tracker.delivery/graphql
  rate-limit:
    mode: local
    capacity: 10
    refill-tokens: 10
    refill-period: 1s
    max-wait: 10s
  client-id: ${DELIVERY_TRACKER_CLIENT_ID}
  client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET}