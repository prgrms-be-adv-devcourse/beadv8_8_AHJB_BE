spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:1
    admin:
      auto-create: false
    listener:
      auto-startup: false
    producer:
      properties:
        "[max.block.ms]": 0

# delivery: 키가 없으면 기동 실패하므로 더미값
delivery-tracker:
  client-id: test-client-id
  client-secret: test-client-secret
