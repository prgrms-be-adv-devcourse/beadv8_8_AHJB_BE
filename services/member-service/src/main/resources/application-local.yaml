spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/embedding_db
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:p@ssword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092

# 해당 키는 로컬에서만 쓰이는 키 입니다.
jwt:
  secret: dGhpcy1pcy1hLXZlcnktbG9uZy1zZWNyZXQta2V5LWZvci1qd3QtaHMyNTY=

logging:
  level:
    org.hibernate.SQL: debug

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:8080

