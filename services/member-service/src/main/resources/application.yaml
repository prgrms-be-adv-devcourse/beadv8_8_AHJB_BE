server:
  port: 8083
spring:
  application:
    name: back
  jpa:
    open-in-view: false
jwt:
  access-token-expiration: 900000
  refresh-token-expiration: 1209600000

cors:
  allowed-origins:
    - http://localhost:5173

auth:
  refresh-cookie:
    name: refresh_token
    path: /api/v1/auth
    same-site: Strict
    secure: true
