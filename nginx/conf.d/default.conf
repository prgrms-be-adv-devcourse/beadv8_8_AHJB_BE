   # HTTP: 인증서 확인 경로만 응답하고 나머지는 HTTPS로 리다이렉트
   server {
       listen 80;
       server_name api.jjinmak.kro.kr;

       location /.well-known/acme-challenge/ {
           root /var/www/certbot;
       }

       location / {
           return 301 https://$host$request_uri;
       }
   }

   # HTTPS
   server {
       listen 443 ssl;
       server_name api.jjinmak.kro.kr;

       ssl_certificate     /etc/letsencrypt/live/api.jjinmak.kro.kr/fullchain.pem;
       ssl_certificate_key /etc/letsencrypt/live/api.jjinmak.kro.kr/privkey.pem;

       # 업로드 요청 본문 최대 크기 (변경시 Spring multipart max-request-size도 함께 변경 필요)
       client_max_body_size 13m;

       # Docker 내부 DNS를 10초마다 다시 조회 (app 컨테이너 IP 변경 대응)
       resolver 127.0.0.11 valid=10s ipv6=off;
       set $app_upstream http://app:8080;

       location / {
           proxy_pass $app_upstream;

           proxy_set_header Host              $host;
           proxy_set_header X-Real-IP         $remote_addr;
           proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
       }
   }