spring:
  application:
    name: back
  jpa:
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB     # 상품 이미지 1장 최대 크기
      max-request-size: 11MB  # multipart 헤더 여유분 포함

jwt:
  access-token-expiration: 900000
  refresh-token-expiration: 1209600000

delivery-tracker:
  base-url: https://apis.tracker.delivery/graphql
  rate-limit:
    mode: local
    capacity: 10
    refill-tokens: 10
    refill-period: 1s
    max-wait: 10s
  client-id: ${DELIVERY_TRACKER_CLIENT_ID}
  client-secret: ${DELIVERY_TRACKER_CLIENT_SECRET}

cors:
  allowed-origins:
    - http://localhost:5173

auth:
  refresh-cookie:
    name: refresh_token
    path: /api/v1/auth
    same-site: Strict
    secure: true