# 배포 단위: auxiliary-service
# 포함 컨텍스트: chat, notification, delivery
apiVersion: v1
kind: ConfigMap
metadata:
  name: auxiliary-config
  namespace: app
data:
  DB_URL: jdbc:postgresql://postgres.infra.svc.cluster.local:5432/auxiliary_module_db
  KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:19092
  WEB_BASE_URL: https://jjinmak.kro.kr/
  FCM_ENABLED: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auxiliary-service
  namespace: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: auxiliary-service
  template:
    metadata:
      labels:
        app: auxiliary-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: auxiliary-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/auxiliary-service:initial
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: auxiliary-config
            - secretRef:
                name: auxiliary-module-db-secret
            - secretRef:
                name: delivery-secret
            - secretRef:
                name: notification-fcm-secret
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 896Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            periodSeconds: 10
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8087
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8087
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: auxiliary-service
  namespace: app
spec:
  selector:
    app: auxiliary-service
  ports:
    - port: 80
      targetPort: 8087
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: app
spec:
  selector:
    app: auxiliary-service
  ports:
    - port: 80
      targetPort: 8087
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: app
spec:
  selector:
    app: auxiliary-service
  ports:
    - port: 80
      targetPort: 8087
---
apiVersion: v1
kind: Service
metadata:
  name: delivery-service
  namespace: app
spec:
  selector:
    app: auxiliary-service
  ports:
    - port: 80
      targetPort: 8087
