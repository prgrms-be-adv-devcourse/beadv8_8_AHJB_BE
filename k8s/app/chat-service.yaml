apiVersion: v1
kind: ConfigMap
metadata:
  name: chat-config
  namespace: app
data:
  DB_URL: jdbc:postgresql://postgres.infra.svc.cluster.local:5432/chat_db
  KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:19092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: chat-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/chat-service:b26d9365104f9e5dbe77c06097ae1a1303fcb323
          ports:
            - containerPort: 8093
          envFrom:
            - configMapRef:
                name: chat-config
            - secretRef:
                name: chat-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
  namespace: app
spec:
  selector:
    app: chat-service
  ports:
    - port: 80
      targetPort: 8093