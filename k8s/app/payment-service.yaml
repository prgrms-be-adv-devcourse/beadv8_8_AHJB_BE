apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: app
data:
  DB_URL: jdbc:postgresql://postgres.infra.svc.cluster.local:5432/payment_db
  KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:19092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: payment-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/payment-service:ee05be9887763a7dedae0c8ec4dfca0c0a46d977
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: payment-config
            - secretRef:
                name: payment-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: app
spec:
  selector:
    app: payment-service
  ports:
    - port: 80
      targetPort: 8085