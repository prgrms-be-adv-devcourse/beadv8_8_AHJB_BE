apiVersion: v1
kind: ConfigMap
metadata:
  name: recommend-config
  namespace: app
data:
  DB_URL: jdbc:postgresql://postgres.infra.svc.cluster.local:5432/recommend_db
  KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:19092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommend-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommend-service
  template:
    metadata:
      labels:
        app: recommend-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: recommend-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/recommend-service:6b0466b78519ecbbef4ea12c775bbe63921d7bb4
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: recommend-config
            - secretRef:
                name: recommend-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: recommend-service
  namespace: app
spec:
  selector:
    app: recommend-service
  ports:
    - port: 80
      targetPort: 8090