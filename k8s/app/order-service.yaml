apiVersion: v1
kind: ConfigMap
metadata:
  name: order-config
  namespace: app
data:
  DB_URL: jdbc:postgresql://postgres.infra.svc.cluster.local:5432/order_db
  KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:19092
  PAYMENT_SERVICE_BASE_URL: http://payment-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: order-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/order-service:6b0466b78519ecbbef4ea12c775bbe63921d7bb4
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: order-config
            - secretRef:
                name: order-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: app
spec:
  selector:
    app: order-service
  ports:
    - port: 80
      targetPort: 8084