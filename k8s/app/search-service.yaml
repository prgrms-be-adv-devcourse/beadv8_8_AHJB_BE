apiVersion: v1
kind: ConfigMap
metadata:
  name: search-config
  namespace: app
data:
  # 상품 검색용 Elasticsearch (보안 꺼짐 - 계정 없음, nori 플러그인 필요)
  ES_URIS: http://elasticsearch.infra.svc.cluster.local:9200
  KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:19092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-service
  template:
    metadata:
      labels:
        app: search-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: search-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/search-service:82b54f0eca89c9be431d084e229ee8c2bda21995
          ports:
            - containerPort: 8092
          envFrom:
            - configMapRef:
                name: search-config
---
apiVersion: v1
kind: Service
metadata:
  name: search-service
  namespace: app
spec:
  selector:
    app: search-service
  ports:
    - port: 80
      targetPort: 8092

