apiVersion: v1
kind: ConfigMap
metadata:
  name: settlement-config
  namespace: app
data:
  DB_URL: jdbc:postgresql://postgres.infra.svc.cluster.local:5432/settlement_db
  KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:19092
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: settlement-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: settlement-service
  template:
    metadata:
      labels:
        app: settlement-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: settlement-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/settlement-service:02873562c95ccfdc73ed532652ec22d5ea7b6ea6
          ports:
            - containerPort: 8089
          envFrom:
            - configMapRef:
                name: settlement-config
            - secretRef:
                name: settlement-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: settlement-service
  namespace: app
spec:
  selector:
    app: settlement-service
  ports:
    - port: 80
      targetPort: 8089