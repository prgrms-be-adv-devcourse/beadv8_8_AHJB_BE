apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: app
data:
  JWT_PUBLIC_KEY: 
  CORS_ALLOWED_ORIGINS: https://jjinmak.kro.kr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: gateway-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/gateway-service:b68eb0cce3a2467e2047a02edfcbb86f73464a50
          ports:
            - name: http
              containerPort: 8091
            # actuator 전용 관리 포트 (Service/ingress로 노출하지 않음, Prometheus가 파드로 직접 수집)
            - name: management
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            # 컨테이너 가용 메모리 상한의 60%를 힙 최대치로 사용
            # 나머지는 메타스페이스, Netty 다이렉트 메모리, 스레드 스택이 사용하도록 함
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          # 앱이 요청을 받을 준비가 된 이후에 트래픽을 보내도록 설정
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8091
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8091
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: app
spec:
  selector:
    app: gateway-service
  ports:
    - port: 80
      targetPort: 8091