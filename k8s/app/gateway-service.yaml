apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: app
data:
  JWT_PUBLIC_KEY: 
  CORS_ALLOWED_ORIGINS: https://jjinmak.kro.kr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: gateway-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/gateway-service:b68eb0cce3a2467e2047a02edfcbb86f73464a50
          ports:
            - containerPort: 8091
          envFrom:
            - configMapRef:
                name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: app
spec:
  selector:
    app: gateway-service
  ports:
    - port: 80
      targetPort: 8091