# 배포 단위: market-service
# 포함 컨텍스트: product, auction
apiVersion: v1
kind: ConfigMap
metadata:
  name: market-config
  namespace: app
data:
  DB_URL: jdbc:postgresql://postgres.infra.svc.cluster.local:5432/market_module_db
  KAFKA_BOOTSTRAP_SERVERS: kafka.infra.svc.cluster.local:19092
  # 상품 이미지 저장소 (S3, 서버 IAM 역할로 접근 - Access Key 없음)
  IMAGE_STORAGE: s3
  S3_BUCKET: team03-jjinmak-s3-823315816237-ap-northeast-2-an
  AWS_REGION: ap-northeast-2
  S3_KEY_PREFIX: dev/
  S3_PUBLIC_BASE_URL: https://team03-jjinmak-s3-823315816237-ap-northeast-2-an.s3.ap-northeast-2.amazonaws.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service
  namespace: app
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: market-service
  template:
    metadata:
      labels:
        app: market-service
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: market-service
          image: ghcr.io/prgrms-be-adv-devcourse/beadv8_8_ahjb_be/market-service:initial
          ports:
            - name: http
              containerPort: 8086
          envFrom:
            - configMapRef:
                name: market-config
            - secretRef:
                name: market-module-db-secret
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError"
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            periodSeconds: 10
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: market-service
  namespace: app
spec:
  selector:
    app: market-service
  ports:
    - port: 80
      targetPort: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: product-service
  namespace: app
spec:
  selector:
    app: market-service
  ports:
    - port: 80
      targetPort: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: auction-service
  namespace: app
spec:
  selector:
    app: market-service
  ports:
    - port: 80
      targetPort: 8086
