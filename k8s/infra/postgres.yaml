apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: infra
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: infra
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # 커널 7.0.0-1017-aws에서 AppArmor(cri-containerd 프로필)가 컨테이너 내부 SIGURG를 차단해
      # gosu/postgres가 기동하지 못하는 문제 우회. 커널/k3s 수정 후 Unconfined 제거 검토.
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        appArmorProfile:
          type: Unconfined
      nodeSelector:
        jjinmak/role: infra
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          args: ["-c", "shared_buffers=256MB"]
          env:
            - name: TZ
              value: Asia/Seoul
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
