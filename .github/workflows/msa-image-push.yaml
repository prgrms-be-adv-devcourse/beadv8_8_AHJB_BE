name: MSA Image Push

on:
  workflow_dispatch:
    inputs:
      service:
        description: 빌드할 서비스
        required: true
        type: choice
        options:
          - member-service
          - gateway-service
          - order-service
          - delivery-service
          - recommend-service
          - payment-service
          - auction-service
          - notification-service

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 checkout
        uses: actions/checkout@v4

      - name: 이미지 이름과 태그 설정
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ inputs.service }}" >> "$GITHUB_ENV"
          echo "TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ inputs.service }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: 결과 출력
        run: echo "pushed ${{ env.IMAGE }}:${{ env.TAG }}"