name: CI

on:
  pull_request:
    branches: [develop, main]

  # CD 워크플로 추가 전까지 머지 후 테스트용 (CD 추가 시 CD에서 테스트하므로 제거)
  push:
    branches: [develop, main]

permissions:
  contents: read

# PR은 PR 번호로, push는 브랜치 이름으로 그룹을 나눔
# 같은 그룹에서 새 실행이 시작되면 진행 중인 이전 실행은 취소됨
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: 코드 가져오기 (checkout)
        uses: actions/checkout@v4

      - name: JDK 25 temurin 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: |
          chmod +x gradlew
          ./gradlew test

      - name: 테스트 실패시에만 report 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7