name: MSA CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      service:
        description: 배포할 서비스 (services/ 아래 디렉터리 이름, 예 order-service)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: msa-cd
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.pick.outputs.services }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 배포를 진행할 서비스 선택합니다.
        id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SERVICE: ${{ inputs.service }}   # 문자열 입력은 env로만 받음 (스크립트 주입 방지)
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # 자유 입력이므로 형식과 배포 가능 여부를 검증
            if ! [[ "$INPUT_SERVICE" =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::서비스 이름 형식이 아닙니다: $INPUT_SERVICE"; exit 1
            fi
            if [ ! -d "services/$INPUT_SERVICE" ] || [ ! -f "k8s/app/$INPUT_SERVICE.yaml" ]; then
              echo "::error::$INPUT_SERVICE 는 배포할 수 없습니다 (services/ 디렉터리와 k8s/app 매니페스트가 모두 있어야 함)"; exit 1
            fi
            echo "services=[\"$INPUT_SERVICE\"]" >> "$GITHUB_OUTPUT"
          else
            bash .github/scripts/changed-services.sh "$BEFORE_SHA" "$HEAD_SHA" deploy
          fi

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: 서버에 배포될 이미지 이름 설정
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    needs: [changes, build]
    runs-on: [self-hosted, k3s]
    strategy:
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - name: 이미지 태그 적용
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}:${{ github.sha }}"
          sed -i "s|image: .*/${{ matrix.service }}:.*|image: ${IMAGE}|" k8s/app/${{ matrix.service }}.yaml
          grep "image:" k8s/app/${{ matrix.service }}.yaml

      - name: 배포 개시!
        run: |
          export KUBECONFIG="$HOME/.kube/cd-config"
          kubectl apply -f k8s/app/${{ matrix.service }}.yaml
          kubectl rollout status deploy/${{ matrix.service }} -n app --timeout=300s