name: CD

on:
  push:
    branches: [develop]

permissions:
  contents: read

# 배포가 중간에 취소되지 않도록 이전 실행이 끝날 때까지 기다림
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: 코드 checkout
        uses: actions/checkout@v4

      - name: JDK 25 temurin 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: |
          chmod +x gradlew
          ./gradlew test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 코드 checkout
        uses: actions/checkout@v4

      - name: 이미지 이름 소문자 변환
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 빌드 및 push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: [self-hosted, dev]
    permissions:
      contents: read
      packages: read
    steps:
      - name: 코드 checkout
        uses: actions/checkout@v4

      - name: GHCR Login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: compose 파일 동기화 및 배포
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${{ github.sha }}"
          cp docker-compose.server.yaml ~/app/docker-compose.server.yaml
          mkdir -p ~/app/nginx
          cp -r nginx/. ~/app/nginx/
          cd ~/app
          sed -i "s|^APP_IMAGE=.*|APP_IMAGE=${IMAGE}|" .env
          docker compose -f docker-compose.server.yaml pull app
          docker compose -f docker-compose.server.yaml up -d
          docker compose -f docker-compose.server.yaml exec -T nginx nginx -t
          docker compose -f docker-compose.server.yaml exec -T nginx nginx -s reload
          docker compose -f docker-compose.server.yaml ps

      - name: 사용하지 않는 이미지 정리
        run: docker image prune -af
      - name: GHCR 로그아웃
        if: always()
        run: docker logout ghcr.io